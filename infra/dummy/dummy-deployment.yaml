apiVersion: apps/v1
kind: Deployment
metadata:
  name: placeholder
  namespace: kube-system
spec:
  replicas: 2 # 총 2개의 여유 공간 확보
  selector:
    matchLabels:
      app: placeholder
  template:
    metadata:
      labels:
        app: placeholder
    spec:
      priorityClassName: overprovisioning
      terminationGracePeriodSeconds: 0
      
      # 한 노드에 더미 파드가 1개씩만 들어가도록 설정
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - placeholder
            topologyKey: "kubernetes.io/hostname"
      
      # AZ별(2a, 2c)로 골고루 배치
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "topology.kubernetes.io/zone"
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: placeholder

      containers:
      - name: pause
        image: registry.k8s.io/pause:3.9
        resources:
          requests:
            cpu: "300m"
            memory: "256Mi"
