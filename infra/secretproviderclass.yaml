apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: alive-valkey-spc
  namespace: backend
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "valkey_key"
        objectType: "secretsmanager"
  secretObjects: 
    - secretName: valkey-auth-sync 
      type: Opaque
      data:
        - objectName: "valkey_key"
          key: password