apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: alive-valkey-spc
  namespace: backend
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "valkey_key"
        objectType: "secretsmanager"
        jmesPath:
          - path: password
            objectAlias: valkey_password

      - objectName: "db-secret"
        objectType: "secretsmanager"
        jmesPath:
          - path: MASTER_HOST
            objectAlias: MASTER_HOST
          - path: SLAVE_HOST
            objectAlias: SLAVE_HOST
          - path: PORT
            objectAlias: PORT
          - path: DB_NAME
            objectAlias: DB_NAME
          - path: USERNAME
            objectAlias: USERNAME
          - path: PASSWORD
            objectAlias: PASSWORD
        
  secretObjects: 
    - secretName: valkey-auth-sync 
      type: Opaque
      data:
        - objectName: "valkey_key"
          key: password

    - secretName: db-auth-sync
      type: Opaque
      data:
        - objectName: "db-secret"
          key: MASTER_HOST
        - objectName: "db-secret"
          key: SLAVE_HOST
        - objectName: "db-secret"
          key: PORT
        - objectName: "db-secret"
          key: DB_NAME
        - objectName: "db-secret"
          key: USERNAME
        - objectName: "db-secret"
          key: PASSWORD