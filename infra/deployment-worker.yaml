apiVersion: apps/v1
kind: Deployment
metadata:
  name: alive-order-post-deployment
  namespace: backend
  labels:
    app: alive-order-post
spec:
  replicas: 10   # 주문 API보다 적게 시작
  selector:
    matchLabels:
      app: alive-order-post
  template:
    metadata:
      labels:
        app: alive-order-post
    spec:
      serviceAccountName: backend-secrets-sa

      nodeSelector:
        karpenter.sh/nodepool: default

      topologySpreadConstraints:
        - maxSkew: 2
          topologyKey: "topology.kubernetes.io/zone"
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: alive-order-post

      containers:
      - name: backend-container
        # image: 877009927021.dkr.ecr.ap-northeast-2.amazonaws.com/al7/ci-jenkins:v90
        image: frozzun99/alive-eks:latest
        imagePullPolicy: Always

        env:
        - name: SPRING_PROFILES_ACTIVE
          value: order-post   # 🔥 핵심

        # (👇 아래는 전부 기존이랑 동일)
        # - name: VALKEY_PASSWORD
        #   valueFrom:
        #     secretKeyRef:
        #       name: valkey-auth-sync
        #       key: password
        - name: VALKEY_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: valkey-endpoint-sync
              key: VALKEY_ENDPOINT
        - name: VALKEY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: valkey-endpoint-sync
              key: VALKEY_PASSWORD

        - name: MASTER_HOST
          valueFrom:
            secretKeyRef:
              name: db-auth-sync
              key: MASTER_HOST
        - name: SLAVE_HOST
          valueFrom:
            secretKeyRef:
              name: db-auth-sync
              key: SLAVE_HOST
        - name: PORT
          valueFrom:
            secretKeyRef:
              name: db-auth-sync
              key: PORT
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-auth-sync
              key: DB_NAME
        - name: USERNAME
          valueFrom:
            secretKeyRef:
              name: db-auth-sync
              key: USERNAME
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-auth-sync
              key: PASSWORD
        - name: ORDER_QUEUE_URL
          valueFrom:
            secretKeyRef:
              name: db-auth-sync
              key: ORDER_QUEUE_URL
        - name: DD_SERVICE
          value: "alive-order-post"
        - name: DD_ENV
          value: "prod"
        - name: DD_VERSION
          value: "v61"
        - name: DD_AGENT_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: DD_TRACE_AGENT_PORT
          value: "8126"
        - name: DD_LOGS_INJECTION
          value: "true"

        #  # sqs
        # - name: order-queue-url
        #   valueFrom:
        #     secretKeyRef:
        #       name: sqs-auth-sync
        #       key: order-queue-url

        # startupProbe:
        #   httpGet:
        #     path: /actuator/health/liveness
        #     port: 8080
        #   failureThreshold: 30   # 30 * 10s = 최대 5분 기동 허용
        #   periodSeconds: 10

        # readinessProbe:
        #   httpGet:
        #     path: /actuator/health/readiness
        #     port: 8080
        #   periodSeconds: 5
        #   failureThreshold: 1
          
        resources:
          requests:
            cpu: "500m"      # 최소 반 개 코어는 확보 (기존 300m에서 상향)
            memory: "1Gi"   # 앱 기본 안정성을 위해 (기존 256Mi에서 상향)
          limits:
            cpu: "1000m"     # 6,000 TPS 피크 시 2코어까지 '버스트' 허용 (가장 중요!)
            memory: "2Gi"

        volumeMounts:
        - name: secrets-store-inline
          mountPath: "/mnt/secrets"
          readOnly: true

      volumes:
      - name: secrets-store-inline
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "alive-valkey-spc"

      imagePullSecrets:
      - name: ecr-registry-key
