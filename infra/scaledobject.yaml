apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: order-worker-scaler
  namespace: backend
spec:
  scaleTargetRef:
    # 중요: Worker Deployment의 name과 정확히 일치해야 함. 
    name: alive-order-post-deployment 
  
  minReplicaCount: 5    # 평소에 최소 1개는 띄워둠
  maxReplicaCount: 100   # 주문 폭주 시 최대 20개까지 확장
  pollingInterval: 5   # 10초마다 SQS 확인
  cooldownPeriod:  60  # 주문이 끝나도 5분간은 노드를 유지 (잦은 생성/삭제 방지)

  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: keda-aws-auth
      metadata:
        # 중요: SQS URL을 여기에 넣으면 됨. 
        queueURL: https://sqs.ap-northeast-2.amazonaws.com/877009927021/OrderQueue.fifo
        queueLength: "20"              # 메시지 5개당 Pod 1개 추가
        awsRegion: "ap-northeast-2"
