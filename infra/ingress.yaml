apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alive-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:elasticloadbalancing:ap-northeast-2:877009927021:loadbalancer/app/k8s-backend-aliveing-2b38371c59/046ffa16ee88fc02
spec:
  ingressClassName: alb
  rules:
    - http: 
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alive-service
                port:
                  number: 80 