apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: alive-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: alive-deployment 
  minReplicas: 15
  maxReplicas: 40
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 30
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0 # 부하 감지 즉시 반응
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
