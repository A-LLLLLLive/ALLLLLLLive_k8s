apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: alive-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: alive-deployment 
  minReplicas: 6        
  maxReplicas: 40
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
