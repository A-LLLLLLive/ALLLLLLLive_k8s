apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: alive-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: alive-deployment 
  minReplicas: 15
  maxReplicas: 30
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50

