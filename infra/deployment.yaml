apiVersion: apps/v1
kind: Deployment
metadata:
  name: alive-deployment
  namespace: backend
  labels:
    app: alive-app
spec:
  replicas: 15
  selector:
    matchLabels:
      app: alive-app    
  template:
    metadata:
      labels:
        app: alive-app  
    spec:
      serviceAccountName: backend-secrets-sa

      nodeSelector:
        karpenter.sh/nodepool: default

      topologySpreadConstraints:
        - maxSkew: 2
          topologyKey: "topology.kubernetes.io/zone"
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: alive-app
      containers:
      - name: backend-container
        # image: 877009927021.dkr.ecr.ap-northeast-2.amazonaws.com/al7/ci-jenkins:v90
        image: frozzun99/alive-eks:latest
        # image: frozzun99/alive-ecs:v5
        imagePullPolicy: Always 
        ports:
        - containerPort: 8080

        env:
        - name: SPRING_PROFILES_ACTIVE
          value: api   # 🔥 핵심

        # Valkey
        # deployment.yaml
        # - name: VALKEY_PASSWORD
        #   valueFrom:
        #     secretKeyRef:
        #       name: valkey-auth-sync # SPC의 secretObjects.secretName과 일치
        #       key: password          # SPC의 secretObjects.data.key와 일치 
        # ✅ Valkey endpoint
        - name: VALKEY_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: valkey-endpoint-sync
              key: VALKEY_ENDPOINT
        - name: VALKEY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: valkey-endpoint-sync
              key: VALKEY_PASSWORD
          
        # Database
        - name: MASTER_HOST
          valueFrom:
            secretKeyRef:
              name: db-auth-sync
              key: MASTER_HOST
        - name: SLAVE_HOST
          valueFrom:
            secretKeyRef:
              name: db-auth-sync
              key: SLAVE_HOST
        - name: PORT
          valueFrom:
            secretKeyRef:
              name: db-auth-sync
              key: PORT
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-auth-sync
              key: DB_NAME
        - name: USERNAME
          valueFrom:
            secretKeyRef:
              name: db-auth-sync
              key: USERNAME
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-auth-sync
              key: PASSWORD
        - name: ORDER_QUEUE_URL
          valueFrom:
            secretKeyRef:
              name: db-auth-sync
              key: ORDER_QUEUE_URL
        - name: DD_SERVICE
          value: "alive-deploy"
        - name: DD_ENV
          value: "prod"
        - name: DD_VERSION
          value: "v61"
        - name: DD_AGENT_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: DD_TRACE_AGENT_PORT
          value: "8126"
        - name: DD_LOGS_INJECTION
          value: "true"

        # # sqs
        # - name: order-queue-url
        #   valueFrom:
        #     secretKeyRef:
        #       name: sqs-auth-sync
        #       key: order-queue-url

        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          failureThreshold: 30   # 30 * 10s = 최대 5분 기동 허용
          periodSeconds: 10
          initialDelaySeconds: 20   # 컨테이너 기동 초기 20초 동안 Probe 미실행

        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          periodSeconds: 5
          failureThreshold: 3        # 1 → 3으로 늘려 안정성 확보
          initialDelaySeconds: 120    # 신규 Pod가 스케일링될 때 바로 Ready 판단 안함

        resources:
          requests:
            cpu: "1000m"      # 최소 반 개 코어는 확보 (기존 300m에서 상향)
            memory: "1Gi"   # 앱 기본 안정성을 위해 (기존 256Mi에서 상향)
          limits:
            cpu: "2000m"     # 6,000 TPS 피크 시 2코어까지 '버스트' 허용 (가장 중요!)
            memory: "2Gi"

        volumeMounts:
        - name: secrets-store-inline
          mountPath: "/mnt/secrets"
          readOnly: true

      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "alive-valkey-spc"

      imagePullSecrets:
      - name: ecr-registry-key
