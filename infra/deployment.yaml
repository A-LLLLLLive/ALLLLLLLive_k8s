apiVersion: apps/v1
kind: Deployment
metadata:
  name: alive-deployment
  namespace: backend
  labels:
    app: alive-app
spec:
  replicas: 6
  selector:
    matchLabels:
      app: alive-app    
  template:
    metadata:
      labels:
        app: alive-app  
    spec:
      serviceAccountName: backend-irsa-sa # 
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "topology.kubernetes.io/zone"
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: alive-app
      containers:
      - name: backend-container
        image: 877009927021.dkr.ecr.ap-northeast-2.amazonaws.com/al7/ci-jenkins:v25
        imagePullPolicy: Always 
        ports:
        - containerPort: 8080 
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3

        resources:
          requests:
            cpu: "100m"
            memory: "256Mi" # 노드가 2cpu / 4Gi -> pod 6개이면 0.1cpu = 20개 정도? / 0.256Gi = 18개
          limits:
            cpu: "200m" 
            memory: "512Mi"
      imagePullSecrets:
      - name: ecr-registry-key
