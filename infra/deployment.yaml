apiVersion: apps/v1
kind: Deployment
metadata:
  name: alive-deployment
  namespace: backend
  labels:
    app: alive-app
spec:
  replicas: 6
  selector:
    matchLabels:
      app: alive-app    
  template:
    metadata:
      labels:
        app: alive-app  
    spec:
      serviceAccountName: backend-secrets-sa
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "topology.kubernetes.io/zone"
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: alive-app
      containers:
      - name: backend-container
        image: 877009927021.dkr.ecr.ap-northeast-2.amazonaws.com/al7/ci-jenkins:v61
        imagePullPolicy: Always 
        ports:
        - containerPort: 8080

        env:
        - name: SPRING_PROFILES_ACTIVE
          value: api   # 🔥 핵심

        # Valkey
        - name: VALKEY_PASSWORD 
          valueFrom:
            secretKeyRef:
              name: valkey-auth-sync # SPC의 secretObjects.secretName과 일치
              key: password          # SPC의 secretObjects.data.key와 일치 
        
        # Database
        - name: MASTER_HOST
          valueFrom:
            secretKeyRef:
              name: db-auth-sync
              key: MASTER_HOST
        - name: SLAVE_HOST
          valueFrom:
            secretKeyRef:
              name: db-auth-sync
              key: SLAVE_HOST
        - name: PORT
          valueFrom:
            secretKeyRef:
              name: db-auth-sync
              key: PORT
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-auth-sync
              key: DB_NAME
        - name: USERNAME
          valueFrom:
            secretKeyRef:
              name: db-auth-sync
              key: USERNAME
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-auth-sync
              key: PASSWORD
        - name: ORDER_QUEUE_URL
          valueFrom:
            secretKeyRef:
              name: db-auth-sync
              key: ORDER_QUEUE_URL

        # # sqs
        # - name: order-queue-url
        #   valueFrom:
        #     secretKeyRef:
        #       name: sqs-auth-sync
        #       key: order-queue-url

        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3

        resources:
          requests:
            cpu: "100m"
            memory: "256Mi" # 노드가 2cpu / 4Gi -> pod 6개이면 0.1cpu = 20개 정도? / 0.256Gi = 18개
          limits:
            cpu: "200m" 
            memory: "512Mi"

        volumeMounts:
        - name: secrets-store-inline
          mountPath: "/mnt/secrets"
          readOnly: true

      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "alive-valkey-spc"

      imagePullSecrets:
      - name: ecr-registry-key