apiVersion: apps/v1
kind: Deployment
metadata:
  name: alive-deployment
  labels:
    app: alive-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alive-app    
  template:
    metadata:
      labels:
        app: alive-app  
    spec:
      containers:
      - name: backend-container
        image: 877009927021.dkr.ecr.ap-northeast-2.amazonaws.com/al7/ci-jenkins:v9
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080  
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"