# 1. SA(신분증) 만들기
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prewarm-scaler-sa
  namespace: backend # backend namespace에서만 유효하다.
---

# 2. 권한(role) 정의하기 : "HPA를 조회하고 수정할 수 있다"
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hpa-scaler-role
  namespace: backend
rules:
  - apiGroups: ["autoscaling"]        
    resources: ["horizontalpodautoscalers"] 
    verbs: ["get", "patch", "update"]    

---

# 3. 연결(RoleBinding)하기: "위 신분증에 위 권한을 부여한다"
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hpa-scaler-rolebinding
  namespace: backend
subjects:
  - kind: ServiceAccount
    name: prewarm-scaler-sa               
    namespace: backend
roleRef:
  kind: Role
  name: hpa-scaler-role
  apiGroup: rbac.authorization.k8s.io